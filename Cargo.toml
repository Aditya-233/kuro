[package]
name = "kuro"
version = "0.1.0"
edition = "2021"
authors = ["Aditya <adityapadhi233@gmail.com>"]
description = "Kuro (黒) — Minimalist monochrome native anime desktop app and agent-accessible CLI engine in pure Rust"
repository = "https://github.com/Aditya-233/kuro"
license = "MIT OR Apache-2.0"

[lib]
name = "kuro"
path = "src/lib.rs"

[[bin]]
name = "kuro"
path = "src/main.rs"

[dependencies]
# GUI Runtime
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "tokio", "image", "canvas", "svg"] }

# Async & Networking (Pure Rust TLS - zero C OpenSSL dependency)
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
bytes = "1.12"

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Error Handling & Diagnostics
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System & Files
directories = "6.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.17"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
